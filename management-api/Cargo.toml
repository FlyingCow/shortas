[package]
name = "management-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[[bin]]
name = "management-api"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# Core async runtime and utilities
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
futures.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Time and date
chrono.workspace = true

# Configuration
config.workspace = true
clap.workspace = true
dotenv.workspace = true

# Web framework
salvo.workspace = true
http.workspace = true
reqwest.workspace = true

# Database
sqlx.workspace = true

# Search
elasticsearch.workspace = true

# Caching (notification template store)
moka.workspace = true

# Object storage
aws-sdk-s3.workspace = true
aws-config.workspace = true

# Email (SES in prod)
aws-sdk-sesv2.workspace = true
lettre.workspace = true

# Messaging
lapin.workspace = true

# Utilities
uuid.workspace = true
rand.workspace = true
base64.workspace = true
url.workspace = true
validator.workspace = true
derive_more.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Security
jsonwebtoken.workspace = true
sha2.workspace = true

# Test mocking of domain traits, also exposed to downstream crates (e.g.
# notification-worker) via the `mocks` feature so they can mock the same
# trait definitions instead of redeclaring them.
mockall.workspace = true

[dev-dependencies]
wiremock.workspace = true

[features]
mocks = []
