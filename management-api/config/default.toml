[server]
host = "0.0.0.0"
port = 8080

[database]
host = "localhost"
port = 5432
username = "postgres"
password = "postgres"
database = "shortas"
max_connections = 10

[jwt]
issuer = "https://auth.shortas.work/realms/shortas"
audience = "shortas-api"
jwks_url = "https://auth.shortas.work/realms/shortas/protocol/openid-connect/certs"

[click_router]
base_url = "http://localhost:8081"
timeout_ms = 5000

[click_aggregator]
base_url = "http://localhost:8082"
timeout_ms = 10000

[elasticsearch]
url = "http://localhost:9200"
routes_index = "routes"

# endpoint/access_key/secret_key are intentionally NOT set here - they're
# local-only values (set in development.toml for docker-compose). When
# left unset, MinioService falls back to the real AWS S3 endpoint and the
# ECS task's IAM role, which is what every non-local run mode needs.
[minio]
region = "us-east-1"
bucket = "shortas"

[rabbitmq]
url = "amqp://localhost:5672"
domain_verification_queue = "domain-verification"
route_status_queue = "route-status"
notifications_exchange = "notifications"
notifications_queue = "notifications"
notifications_retry_queue = "notifications.retry"
notifications_dead_queue = "notifications.dead"
notifications_retry_delay_ms = 30000
notifications_max_retries = 5

[shared_domains]
names = ["shortas.space"]

# provider defaults to "ses" (see EmailSettings::default) - unset here so
# production.toml / env vars are the source of truth for region/from address.
[email]
dashboard_base_url = "https://app.shortas.space"
