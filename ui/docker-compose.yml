include:
  - ../redirect/docker-compose.yml

services:
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: shortas-dashboard
    ports:
      - "3000:80"
    environment:
      REACT_APP_KEYCLOAK_URL: ${REACT_APP_KEYCLOAK_URL:-http://localhost:8080}
      REACT_APP_KEYCLOAK_CLIENT_ID: ${REACT_APP_KEYCLOAK_CLIENT_ID:-shortas-dashboard}
      REACT_APP_PROXY_API_URL: ${REACT_APP_PROXY_API_URL:-http://localhost:8090}
      REACT_APP_ROUTE_IMAGES_BASE_URL: ${REACT_APP_ROUTE_IMAGES_BASE_URL:-http://localhost:9003}
    networks:
      - shortas-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    container_name: shortas-landing
    ports:
      - "3002:80"
    networks:
      - shortas-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  shortas-net:
