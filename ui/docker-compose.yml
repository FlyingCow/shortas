include:
  - ../redirect/docker-compose.yml

services:
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: shortas-dashboard
    ports:
      - "3000:80"
    networks:
      - shortas-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    container_name: shortas-landing
    ports:
      - "3001:80"
    networks:
      - shortas-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  shortas-net:
