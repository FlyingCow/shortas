version: '3.8'

services:
  shortas-api-postgres:
    image: postgres:15-alpine
    container_name: shortas-api-postgres
    environment:
      POSTGRES_DB: shortas_dev_db
      POSTGRES_USER: shortas_user
      POSTGRES_PASSWORD: shortas_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortas_user -d shortas_dev_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shortas-net

  shortas-api-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.16
    container_name: shortas-api-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shortas-net

  shortas-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shortas-api
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8090
      - ApiSettings__ClickRouterApi__BaseUrl=http://click-router-api:5810
      - ApiSettings__ClickAggregatorApi__BaseUrl=http://click-aggregator-api:5820
      - ApiSettings__DomainVerifier__BaseUrl=http://domain-verifier:5830
      - Elasticsearch__Url=http://shortas-api-elasticsearch:9200
      - Keycloak__Authority=http://keycloak:8080/realms/shortas-dev
      - Keycloak__Audience=shortas-api
      - Keycloak__RequireHttpsMetadata=false
      - ConnectionStrings__DefaultConnection=Host=shortas-api-postgres;Database=shortas_dev_db;Username=shortas_user;Password=shortas_password;Port=5432
      - RabbitMQ__Uri=amqp://guest:guest@shortas-rabbitmq:5672/%2f
    depends_on:
      shortas-api-postgres:
        condition: service_healthy
      shortas-api-elasticsearch:
        condition: service_healthy
    networks:
      - shortas-net
    volumes:
      - ./logs:/app/logs

networks:
  shortas-net:
    external: true

volumes:
  postgres_data:
  elasticsearch_data:

