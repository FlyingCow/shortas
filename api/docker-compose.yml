version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shortas-postgres
    environment:
      POSTGRES_DB: shortas_dev_db
      POSTGRES_USER: shortas_user
      POSTGRES_PASSWORD: shortas_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortas_user -d shortas_dev_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

