name: Build and publish images

# Builds every deployable service image and pushes it to GHCR, tagged with
# the short commit SHA and (on main) "latest". Used by the Hetzner compose
# files in infra/hetzner/ via IMAGE_REGISTRY/IMAGE_TAG — see
# infra/hetzner/README.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: click-router
            dockerfile: redirect/click-router/Dockerfile
            context: .
          - service: click-router-api
            dockerfile: redirect/click-router-api/Dockerfile
            context: .
          - service: click-tracker
            dockerfile: redirect/click-tracker/Dockerfile
            context: .
          - service: click-aggregator
            dockerfile: redirect/click-aggregator/Dockerfile
            context: .
          - service: click-aggregator-api
            dockerfile: redirect/click-aggregator-api/Dockerfile
            context: .
          - service: domain-verifier
            dockerfile: redirect/domain-verifier/Dockerfile
            context: .
          - service: route-verifier
            dockerfile: redirect/route-verifier/Dockerfile
            context: .
          - service: route-icon-worker
            dockerfile: redirect/route-icon-worker/Dockerfile
            context: .
          - service: cert-bot
            dockerfile: redirect/cert-bot/Dockerfile
            context: .
          - service: pages
            dockerfile: redirect/infra/pages/Dockerfile
            context: .
          - service: management-api
            dockerfile: management-api/Dockerfile
            context: .
          - service: notification-worker
            dockerfile: notification-worker/Dockerfile
            context: .
          - service: dashboard
            dockerfile: ui/dashboard/Dockerfile
            context: ui/dashboard
          - service: landing
            dockerfile: ui/landing/Dockerfile
            context: ui/landing
          # fluvio-run (infinyon/fluvio:stable) only contains the SPU/SC
          # server runner, not the fluvio client CLI — this image is for the
          # sc-setup/topic-setup one-off jobs in infra/hetzner*/ that need
          # `fluvio profile|cluster|topic` commands, which that image can't
          # run at all.
          - service: fluvio-cli
            dockerfile: redirect/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          # Owner is hardcoded lowercase: Docker image refs must be
          # lowercase, but github.repository_owner preserves "FlyingCow"'s
          # casing as-is.
          tags: |
            ghcr.io/flyingcow/shortas/${{ matrix.service }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/flyingcow/shortas/{0}:latest', matrix.service) || '' }}
