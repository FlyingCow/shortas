
# Platform node (recommended: Hetzner CX43). Runs the single-instance,
# non-hot-path services: Keycloak (auth), and the Prometheus/Grafana/Loki
# monitoring stack. Caddy (below) terminates TLS for auth.${DOMAIN} and
# grafana.${DOMAIN} and proxies to the containers on this same host.
#
# Keycloak's own Postgres ("keycloak-db") lives on the data node, not here —
# see docker-compose.data.yml. Fill in DATA_NODE_IP in .env.platform so the
# "keycloak-db" hostname Keycloak expects resolves to it.

networks:
  shortas-net:
    name: shortas-net
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  caddy_data:
  caddy_config:

services:
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.6
    container_name: keycloak
    restart: unless-stopped
    # Not --optimized: that skips Keycloak's build step and trusts a
    # previous `kc.sh build`, which this stock image never ran — it would
    # silently keep defaulting to H2 instead of picking up KC_DB=postgres
    # below. Plain `start` re-runs the build step from env vars every boot
    # (slightly slower startup, correct DB).
    command: ["start"]
    # Resolve the hostname Keycloak's KC_DB_URL expects to the data node's
    # private IP (cross-host container-name DNS does not otherwise exist).
    extra_hosts:
      - "keycloak-db:${DATA_NODE_IP}"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../../infra/custom/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ../../infra/custom/keycloak/keycloak-theme:/opt/keycloak/themes/shortas/login:ro
      - ../../infra/custom/keycloak/keycloak-theme-account:/opt/keycloak/themes/shortas/account:ro
    networks:
      - shortas-net

  # Realm-export.json ships with NO smtpServer configured, so without this,
  # "forgot password" / "change password" emails are silently never sent —
  # the realm itself has nowhere to send them from. Idempotent: just PUTs
  # the smtpServer block on every boot, safe to re-run.
  keycloak-smtp-setup:
    image: alpine:latest
    container_name: shortas-keycloak-smtp-setup
    depends_on:
      - keycloak
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${EMAIL_FROM_ADDRESS}
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl
        for i in $$(seq 1 30); do
          curl -sf "$$KEYCLOAK_URL/realms/master" >/dev/null 2>&1 && break
          echo "Waiting for Keycloak..."; sleep 3
        done
        TOKEN=$$(curl -s -d "client_id=admin-cli" -d "username=$$KEYCLOAK_ADMIN_USER" -d "password=$$KEYCLOAK_ADMIN_PASSWORD" -d "grant_type=password" "$$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
        if [ -z "$$TOKEN" ]; then echo "Failed to get Keycloak admin token"; exit 1; fi
        curl -sf -X PUT "$$KEYCLOAK_URL/admin/realms/$$KEYCLOAK_REALM" \
          -H "Authorization: Bearer $$TOKEN" -H "Content-Type: application/json" \
          -d "{\"smtpServer\":{\"host\":\"$$SMTP_HOST\",\"port\":\"$$SMTP_PORT\",\"from\":\"$$SMTP_FROM\",\"fromDisplayName\":\"Shortas\",\"auth\":\"true\",\"user\":\"$$SMTP_USERNAME\",\"password\":\"$$SMTP_PASSWORD\",\"starttls\":\"true\",\"ssl\":\"false\"}}"
        echo "Keycloak SMTP configured"
    networks:
      - shortas-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: shortas-prometheus
    restart: unless-stopped
    extra_hosts:
      - "app-node-1:${APP_NODE_1_IP}"
      - "app-node-2:${APP_NODE_2_IP}"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9091:9090"
    networks:
      - shortas-net

  loki:
    image: grafana/loki:3.0.0
    container_name: shortas-loki
    restart: unless-stopped
    environment:
      - HETZNER_S3_ACCESS_KEY=${HETZNER_S3_ACCESS_KEY}
      - HETZNER_S3_SECRET_KEY=${HETZNER_S3_SECRET_KEY}
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yml -config.expand-env=true
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - shortas-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: shortas-grafana
    restart: unless-stopped
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://${GRAFANA_HOSTNAME}
    depends_on:
      - prometheus
      - loki
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - shortas-net

  # Terminates TLS for this node's own public hostnames (auth, grafana) and
  # reverse-proxies to the containers above over localhost. Separate from
  # cert-bot, which only manages certs for *customer* short-domains on the
  # app nodes' click-router.
  caddy:
    image: caddy:2-alpine
    container_name: shortas-caddy
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./Caddyfile.platform:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - KEYCLOAK_HOSTNAME=${KEYCLOAK_HOSTNAME}
      - GRAFANA_HOSTNAME=${GRAFANA_HOSTNAME}
