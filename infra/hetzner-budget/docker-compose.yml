# Budget single-VM Hetzner deployment. Recommended: CX43 (8 vCPU / 16GB,
# ~€16/mo) + automated backups (~€3/mo) — see ../hetzner/README.md's
# "Budget single-node" section for the trade-offs vs. the multi-node
# production layout in ../hetzner/.
#
# Differences from ../hetzner/ (production, 4 nodes):
#   - Everything on one Docker network — no cross-host extra_hosts wiring,
#     container-name DNS just works like it does in infra/custom/.
#   - Images are pulled prebuilt from GHCR, never built on the box — a CX43
#     building 9+ Rust crates from source would be slow and risks OOM.
#   - Self-hosted MinIO/RustFS instead of Hetzner Object Storage — on a
#     single box there's no durability win from paying for Object Storage,
#     so this tier keeps everything free beyond the one VM.
#   - One Postgres instance serves both the API db and Keycloak's db (see
#     postgres-init/) to save a container.
#   - No HA: one Mongo/Postgres/ClickHouse/Redis/RabbitMQ, one copy of every
#     app service. Vault, mongo-express, and Mailhog are dropped entirely
#     (unused / dev-only) to keep RAM headroom.
#   - Monitoring (Prometheus/Grafana/Loki) is OFF by default — enable with
#     `docker compose --profile observability up -d` once you've confirmed
#     the box has headroom (see README.md).

networks:
  shortas-net:
    name: shortas-net
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  clickhouse_data:
  redis_data:
  elasticsearch_data:
  rabbitmq_data:
  minio_data:
  safe_browsing_data:
  cert_bot_data:
  fluvio_sc_metadata:
  fluvio_spu_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  loki_data:

x-rust-logging: &rust-logging
  RUST_LOG: warn
  APP_RUN_MODE: production

services:
  # --- Data layer ---

  postgres:
    image: postgres:16.2
    container_name: shortas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${API_DB_NAME}
      POSTGRES_USER: ${API_DB_USER}
      POSTGRES_PASSWORD: ${API_DB_PASSWORD}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${API_DB_USER} -d ${API_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shortas-net

  mongo:
    image: mongo:7
    container_name: shortas-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - shortas-net

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: shortas-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    # Migration 001 creates click_stream with SETTINGS storage_policy =
    # 's3_main' — that policy only exists if this storage.xml is in place
    # before clickhouse-server starts, so render it from the template
    # (real credentials, not baked in) before exec'ing the image's own
    # entrypoint.
    entrypoint: ["sh", "-c"]
    command:
      - |
        sed "s|__S3_ACCESS_KEY__|${S3_ACCESS_KEY}|g; s|__S3_SECRET_KEY__|${S3_SECRET_KEY}|g" /tmp/storage.xml.template > /etc/clickhouse-server/config.d/storage.xml
        exec /entrypoint.sh
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/storage.xml.template:/tmp/storage.xml.template:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O /dev/null http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - shortas-net

  clickhouse-migrations:
    image: alpine:latest
    container_name: shortas-clickhouse-migrations
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DATABASE=shortas
    volumes:
      - ../../redirect/click-aggregator-api/migrations:/app/migrations:ro
      - ../../redirect/click-aggregator-api/scripts:/app/scripts:ro
    working_dir: /app
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl bash
        for i in $$(seq 1 10); do
          curl -s "http://clickhouse:8123/ping" | grep -q "Ok" && break
          echo "Attempt $$i: ClickHouse not ready, retrying in 3s..."; sleep 3
        done
        curl -s "http://clickhouse:8123/?user=default&password=${CLICKHOUSE_PASSWORD}" --data-binary "CREATE DATABASE IF NOT EXISTS shortas"
        cd /app/scripts && bash apply_migrations.sh
    networks:
      - shortas-net

  redis:
    image: redis/redis-stack:latest
    container_name: shortas-redis
    restart: unless-stopped
    command: redis-server --save 60 100 --loglevel warning --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - shortas-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.16
    container_name: shortas-api-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms384m -Xmx384m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shortas-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: shortas-rabbitmq
    hostname: shortas-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - shortas-net

  minio:
    image: rustfs/rustfs:latest
    container_name: shortas-minio
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - minio_data:/data
    networks:
      - shortas-net

  minio-setup:
    image: amazon/aws-cli:latest
    container_name: shortas-minio-setup
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
    entrypoint: >
      /bin/sh -c "
        until aws s3 ls >/dev/null 2>&1; do sleep 2; done
        create_bucket() { aws s3api head-bucket --bucket \"\$1\" >/dev/null 2>&1 || aws s3 mb \"s3://\$1\"; }
        create_bucket ${S3_ROUTE_IMAGES_BUCKET}
        create_bucket loki
        create_bucket clickhouse
        printf '%s' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":\"s3:GetObject\",\"Resource\":\"arn:aws:s3:::${S3_ROUTE_IMAGES_BUCKET}/*\"}]}' > /tmp/policy.json
        aws s3api put-bucket-policy --bucket ${S3_ROUTE_IMAGES_BUCKET} --policy file:///tmp/policy.json
        printf '%s' '{\"CORSRules\":[{\"AllowedHeaders\":[\"*\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"POST\",\"DELETE\"],\"AllowedOrigins\":[\"*\"],\"ExposeHeaders\":[\"ETag\",\"Content-Length\",\"Content-Type\"]}]}' > /tmp/cors.json
        aws s3api put-bucket-cors --bucket ${S3_ROUTE_IMAGES_BUCKET} --cors-configuration file:///tmp/cors.json
      "
    networks:
      - shortas-net

  minio-nginx:
    image: nginx:alpine
    container_name: shortas-minio-nginx
    restart: unless-stopped
    volumes:
      - ./minio-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - minio
    networks:
      - shortas-net

  notification-templates-sync:
    image: amazon/aws-cli:latest
    container_name: shortas-notification-templates-sync
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
    volumes:
      - ../../notification-templates:/templates:ro
    entrypoint: >
      /bin/sh -c "aws s3 sync /templates s3://${S3_ROUTE_IMAGES_BUCKET}/notification-templates/ --delete"
    networks:
      - shortas-net

  safe-browsing:
    image: mlsecproject/gglsbl-rest:latest
    container_name: shortas-safe-browsing
    restart: unless-stopped
    environment:
      - TIMEOUT=120
      - GSB_API_KEY=${GSB_API_KEY}
    volumes:
      - safe_browsing_data:/var/lib/gglsbl
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/status"]
      interval: 60s
      timeout: 30s
      retries: 10
      start_period: 600s
    networks:
      - shortas-net

  # --- Fluvio event streaming ---

  sc:
    image: infinyon/fluvio:stable
    container_name: sc
    hostname: sc
    restart: unless-stopped
    command: "./fluvio-run sc --local /fluvio/metadata"
    volumes:
      - fluvio_sc_metadata:/fluvio/metadata
    networks:
      - shortas-net

  sc-setup:
    # infinyon/fluvio:stable only ships the SPU/SC server runner, not the
    # fluvio client CLI this script needs — see fluvio-cli in
    # .github/workflows/docker-publish.yml, built from redirect/Dockerfile.
    image: ${IMAGE_REGISTRY}/fluvio-cli:${IMAGE_TAG}
    container_name: sc-setup
    depends_on:
      - sc
    command: >
      bash -c "
        for i in $$(seq 1 10); do
          fluvio profile add docker sc:9003 docker 2>/dev/null && break
          sleep 3
        done &&
        sleep 2 &&
        (fluvio cluster spu register --id 5001 -p spu:9010 -l spu:9010 --private-server spu:9011 || true)
      "
    networks:
      - shortas-net

  spu:
    image: infinyon/fluvio:stable
    container_name: spu
    hostname: spu
    restart: unless-stopped
    depends_on:
      sc-setup:
        condition: service_completed_successfully
    command: "./fluvio-run spu -i 5001 -p spu:9010 -v spu:9011 --sc-addr sc:9004 --log-base-dir /fluvio/data"
    volumes:
      - fluvio_spu_data:/fluvio/data
    networks:
      - shortas-net

  topic-setup:
    image: ${IMAGE_REGISTRY}/fluvio-cli:${IMAGE_TAG}
    container_name: topic-setup
    depends_on:
      - spu
    command: >
      bash -c "
        fluvio profile add docker sc:9003 docker &&
        for i in $$(seq 1 10); do
          fluvio cluster spu list 2>/dev/null | grep -q 'Online' && break
          sleep 3
        done &&
        (fluvio topic create hit-stream-main || true) &&
        (fluvio topic create click-aggs-main || true)
      "
    networks:
      - shortas-net

  # --- Auth ---

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.6
    container_name: keycloak
    restart: unless-stopped
    # Not --optimized: that skips Keycloak's build step and trusts a
    # previous `kc.sh build`, which this stock image never ran — it would
    # silently keep defaulting to H2 instead of picking up KC_DB=postgres
    # below. Plain `start` re-runs the build step from env vars every boot
    # (slightly slower startup, correct DB). --import-realm is required
    # here too (dropped by mistake when --optimized was removed) — without
    # it Keycloak only ever has the default "master" realm; realm-export.json
    # never gets imported at all.
    command: ["start", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../custom/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ../custom/keycloak/keycloak-theme:/opt/keycloak/themes/shortas/login:ro
      - ../custom/keycloak/keycloak-theme-account:/opt/keycloak/themes/shortas/account:ro
    networks:
      - shortas-net

  # One-time (but idempotent, safe to re-run every boot) fixes to the
  # imported realm that only matter once you're off localhost:
  #   1. SMTP — realm-export.json ships with none configured at all, so
  #      "forgot password" emails were silently never sent.
  #   2. shortas-dashboard client's redirectUris/webOrigins default to
  #      localhost:3000 — without updating them to the real dashboard
  #      domain, login redirects back from Keycloak fail with
  #      "Invalid parameter: redirect_uri".
  #   3. Deletes the seeded "testuser" (password: "testpassword",
  #      committed in plaintext in realm-export.json) — fine for local
  #      dev, not something to leave sitting on an internet-facing box.
  keycloak-realm-setup:
    image: alpine:latest
    container_name: shortas-keycloak-realm-setup
    depends_on:
      - keycloak
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${EMAIL_FROM_ADDRESS}
      DASHBOARD_HOSTNAME: ${DASHBOARD_HOSTNAME}
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl jq
        for i in $$(seq 1 30); do
          curl -sf "$$KEYCLOAK_URL/realms/master" >/dev/null 2>&1 && break
          echo "Waiting for Keycloak..."; sleep 3
        done
        TOKEN=$$(curl -s -d "client_id=admin-cli" -d "username=$$KEYCLOAK_ADMIN_USER" -d "password=$$KEYCLOAK_ADMIN_PASSWORD" -d "grant_type=password" "$$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" | jq -r .access_token)
        if [ -z "$$TOKEN" ] || [ "$$TOKEN" = "null" ]; then echo "Failed to get Keycloak admin token"; exit 1; fi

        curl -sf -o /dev/null -X PUT "$$KEYCLOAK_URL/admin/realms/$$KEYCLOAK_REALM" \
          -H "Authorization: Bearer $$TOKEN" -H "Content-Type: application/json" \
          -d "{\"smtpServer\":{\"host\":\"$$SMTP_HOST\",\"port\":\"$$SMTP_PORT\",\"from\":\"$$SMTP_FROM\",\"fromDisplayName\":\"Shortas\",\"auth\":\"true\",\"user\":\"$$SMTP_USERNAME\",\"password\":\"$$SMTP_PASSWORD\",\"starttls\":\"true\",\"ssl\":\"false\"}}" \
          && echo "SMTP configured"

        CLIENT_UUID=$$(curl -s "$$KEYCLOAK_URL/admin/realms/$$KEYCLOAK_REALM/clients?clientId=shortas-dashboard" -H "Authorization: Bearer $$TOKEN" | jq -r '.[0].id')
        if [ -n "$$CLIENT_UUID" ] && [ "$$CLIENT_UUID" != "null" ]; then
          curl -sf -o /dev/null -X PUT "$$KEYCLOAK_URL/admin/realms/$$KEYCLOAK_REALM/clients/$$CLIENT_UUID" \
            -H "Authorization: Bearer $$TOKEN" -H "Content-Type: application/json" \
            -d "{\"redirectUris\":[\"https://$$DASHBOARD_HOSTNAME/*\"],\"webOrigins\":[\"https://$$DASHBOARD_HOSTNAME\"]}" \
            && echo "shortas-dashboard redirect URIs updated"
        fi

        USER_UUID=$$(curl -s "$$KEYCLOAK_URL/admin/realms/$$KEYCLOAK_REALM/users?username=testuser" -H "Authorization: Bearer $$TOKEN" | jq -r '.[0].id // empty')
        if [ -n "$$USER_UUID" ]; then
          curl -sf -o /dev/null -X DELETE "$$KEYCLOAK_URL/admin/realms/$$KEYCLOAK_REALM/users/$$USER_UUID" -H "Authorization: Bearer $$TOKEN" \
            && echo "seeded testuser deleted"
        fi
    networks:
      - shortas-net

  # --- Application services (prebuilt GHCR images) ---

  click-router:
    image: ${IMAGE_REGISTRY}/click-router:${IMAGE_TAG}
    container_name: shortas-click-router
    restart: unless-stopped
    environment:
      <<: *rust-logging
      APP_METRICS_ADDR: 0.0.0.0:9092
      APP_ENABLE_METRICS: "true"
      APP__MONGODB__URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/
      APP__REDIS__HOST: redis://:${REDIS_PASSWORD}@redis:6379
      APP__RABBITMQ__URI: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@shortas-rabbitmq:5672/%2f
    # Bound to a SECOND server IP (not the default/all-interfaces bind) so
    # it can own standard ports 443/80 for short-link domains without
    # colliding with Caddy, which owns 443/80 on the primary IP for the
    # app's own hostnames. See README.md "Two IPs on one server".
    ports:
      - "${SHORTLINK_IP}:443:4433"
      - "${SHORTLINK_IP}:80:5800"
    depends_on:
      pages:
        condition: service_healthy
    networks:
      - shortas-net

  click-router-api:
    image: ${IMAGE_REGISTRY}/click-router-api:${IMAGE_TAG}
    container_name: shortas-click-router-api
    restart: unless-stopped
    environment:
      <<: *rust-logging
      APP__MONGODB__CONNECTION_STRING: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/
      APP__REDIS__HOST: redis://:${REDIS_PASSWORD}@redis:6379
      APP__RABBITMQ__URI: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@shortas-rabbitmq:5672/%2f
    networks:
      - shortas-net

  click-tracker:
    image: ${IMAGE_REGISTRY}/click-tracker:${IMAGE_TAG}
    container_name: shortas-click-tracker
    restart: unless-stopped
    environment:
      <<: *rust-logging
      APP__REDIS__HOST: redis://:${REDIS_PASSWORD}@redis:6379
      APP__REDIS__PASSWORD: ${REDIS_PASSWORD}
      APP__RABBITMQ__URI: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@shortas-rabbitmq:5672/%2f
    depends_on:
      topic-setup:
        condition: service_completed_successfully
    networks:
      - shortas-net

  click-aggregator:
    image: ${IMAGE_REGISTRY}/click-aggregator:${IMAGE_TAG}
    container_name: shortas-click-aggregator
    restart: unless-stopped
    environment:
      <<: *rust-logging
      METRICS_PORT: 9090
      APP__CLICKHOUSE__CLICK_STREAM_STORE__PASSWORD: ${CLICKHOUSE_PASSWORD}
    depends_on:
      topic-setup:
        condition: service_completed_successfully
    networks:
      - shortas-net

  click-aggregator-api:
    image: ${IMAGE_REGISTRY}/click-aggregator-api:${IMAGE_TAG}
    container_name: shortas-click-aggregator-api
    restart: unless-stopped
    environment:
      <<: *rust-logging
      APP__CLICKHOUSE__PASSWORD: ${CLICKHOUSE_PASSWORD}
    depends_on:
      clickhouse-migrations:
        condition: service_completed_successfully
    networks:
      - shortas-net

  management-api:
    image: ${IMAGE_REGISTRY}/management-api:${IMAGE_TAG}
    container_name: shortas-management-api
    restart: unless-stopped
    environment:
      RUST_LOG: info
      APP_RUN_MODE: production
      APP__SERVER__HOST: 0.0.0.0
      APP__SERVER__PORT: 8080
      APP__DATABASE__HOST: postgres
      APP__DATABASE__PORT: 5432
      APP__DATABASE__USERNAME: ${API_DB_USER}
      APP__DATABASE__PASSWORD: ${API_DB_PASSWORD}
      APP__DATABASE__DATABASE: ${API_DB_NAME}
      APP__DATABASE__MAX_CONNECTIONS: 10
      APP__JWT__ISSUER: https://${KEYCLOAK_HOSTNAME}/realms/${KEYCLOAK_REALM}
      APP__JWT__AUDIENCE: shortas-api
      APP__JWT__JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      APP__CLICK_ROUTER__BASE_URL: http://shortas-click-router-api:5810
      APP__CLICK_AGGREGATOR__BASE_URL: http://shortas-click-aggregator-api:5820
      APP__ELASTICSEARCH__URL: http://shortas-api-elasticsearch:9200
      APP__MINIO__ENDPOINT: http://minio:9000
      APP__MINIO__PUBLIC_ENDPOINT: https://${S3_PUBLIC_HOSTNAME}
      APP__MINIO__REGION: us-east-1
      APP__MINIO__ACCESS_KEY: ${S3_ACCESS_KEY}
      APP__MINIO__SECRET_KEY: ${S3_SECRET_KEY}
      APP__MINIO__BUCKET: ${S3_ROUTE_IMAGES_BUCKET}
      APP__RABBITMQ__URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@shortas-rabbitmq:5672
      APP__EMAIL__PROVIDER: ${EMAIL_PROVIDER}
      APP__EMAIL__SMTP_HOST: ${SMTP_HOST}
      APP__EMAIL__SMTP_PORT: ${SMTP_PORT}
      APP__EMAIL__SMTP_USERNAME: ${SMTP_USERNAME}
      APP__EMAIL__SMTP_PASSWORD: ${SMTP_PASSWORD}
      APP__EMAIL__FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      APP__EMAIL__DASHBOARD_BASE_URL: https://${DASHBOARD_HOSTNAME}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - shortas-net

  notification-worker:
    image: ${IMAGE_REGISTRY}/notification-worker:${IMAGE_TAG}
    container_name: shortas-notification-worker
    restart: unless-stopped
    depends_on:
      notification-templates-sync:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      RUST_LOG: info
      APP_RUN_MODE: production
      APP__DATABASE__HOST: postgres
      APP__DATABASE__PORT: 5432
      APP__DATABASE__USERNAME: ${API_DB_USER}
      APP__DATABASE__PASSWORD: ${API_DB_PASSWORD}
      APP__DATABASE__DATABASE: ${API_DB_NAME}
      APP__DATABASE__MAX_CONNECTIONS: 5
      APP__MINIO__ENDPOINT: http://minio:9000
      APP__MINIO__REGION: us-east-1
      APP__MINIO__ACCESS_KEY: ${S3_ACCESS_KEY}
      APP__MINIO__SECRET_KEY: ${S3_SECRET_KEY}
      APP__MINIO__BUCKET: ${S3_ROUTE_IMAGES_BUCKET}
      APP__RABBITMQ__URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@shortas-rabbitmq:5672
      APP__EMAIL__PROVIDER: ${EMAIL_PROVIDER}
      APP__EMAIL__SMTP_HOST: ${SMTP_HOST}
      APP__EMAIL__SMTP_PORT: ${SMTP_PORT}
      APP__EMAIL__SMTP_USERNAME: ${SMTP_USERNAME}
      APP__EMAIL__SMTP_PASSWORD: ${SMTP_PASSWORD}
      APP__EMAIL__FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
    networks:
      - shortas-net

  domain-verifier:
    image: ${IMAGE_REGISTRY}/domain-verifier:${IMAGE_TAG}
    container_name: shortas-domain-verifier
    restart: unless-stopped
    environment:
      <<: *rust-logging
      APP__MONGODB__CONNECTION_STRING: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/
      APP__RABBITMQ__URI: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@shortas-rabbitmq:5672/%2f
    networks:
      - shortas-net

  route-icon-worker:
    image: ${IMAGE_REGISTRY}/route-icon-worker:${IMAGE_TAG}
    container_name: shortas-route-icon-worker
    restart: unless-stopped
    environment:
      <<: *rust-logging
      APP__RABBITMQ__URI: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@shortas-rabbitmq:5672/%2f
      # route-icon-worker's own crate reads [s3], not [minio] like
      # management-api — APP__MINIO__* here was silently inert, leaving it
      # on default.toml's hardcoded "minioadmin"/"minioadmin" the whole
      # time. Confirmed against the real compiled Settings::new().
      APP__S3__ENDPOINT: http://minio:9000
      APP__S3__ACCESS_KEY: ${S3_ACCESS_KEY}
      APP__S3__SECRET_KEY: ${S3_SECRET_KEY}
      APP__S3__BUCKET: ${S3_ROUTE_IMAGES_BUCKET}
    networks:
      - shortas-net

  route-verifier:
    image: ${IMAGE_REGISTRY}/route-verifier:${IMAGE_TAG}
    container_name: shortas-route-verifier
    restart: unless-stopped
    depends_on:
      - click-router-api
      - safe-browsing
    environment:
      <<: *rust-logging
      APP__MONGODB__CONNECTION_STRING: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/
      APP__RABBITMQ__URI: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@shortas-rabbitmq:5672/%2f
      APP__SAFE_BROWSING__BASE_URL: http://shortas-safe-browsing:5000
    networks:
      - shortas-net

  cert-bot:
    image: ${IMAGE_REGISTRY}/cert-bot:${IMAGE_TAG}
    container_name: shortas-cert-bot
    restart: unless-stopped
    depends_on:
      - click-router-api
    environment:
      <<: *rust-logging
      # Staging ACME directory by default — see README.md before going live.
      # cert-bot's config loader uses prefix "CERTBOT", not "APP" like every
      # other service — see redirect/cert-bot/src/settings.rs.
      CERTBOT__ACME__ACCOUNT_EMAIL: ${ACME_ACCOUNT_EMAIL}
      CERTBOT__MONGODB__URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017
      CERTBOT__RABBITMQ__URI: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@shortas-rabbitmq:5672/%2f
      CERTBOT__CLICK_ROUTER_API__BASE_URL: http://shortas-click-router-api:5810
    volumes:
      - cert_bot_data:/etc/cert-bot
    networks:
      - shortas-net

  pages:
    image: ${IMAGE_REGISTRY}/pages:${IMAGE_TAG}
    container_name: shortas-pages
    hostname: pages
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5801/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - shortas-net

  dashboard:
    image: ${IMAGE_REGISTRY}/dashboard:${IMAGE_TAG}
    container_name: shortas-dashboard
    restart: unless-stopped
    environment:
      REACT_APP_KEYCLOAK_URL: https://${KEYCLOAK_HOSTNAME}
      REACT_APP_KEYCLOAK_CLIENT_ID: shortas-dashboard
      REACT_APP_PROXY_API_URL: https://${API_HOSTNAME}
      REACT_APP_ROUTE_IMAGES_BASE_URL: https://${S3_PUBLIC_HOSTNAME}
    networks:
      - shortas-net

  landing:
    image: ${IMAGE_REGISTRY}/landing:${IMAGE_TAG}
    container_name: shortas-landing
    restart: unless-stopped
    environment:
      REACT_APP_DASHBOARD_URL: https://${DASHBOARD_HOSTNAME}
    networks:
      - shortas-net

  # Terminates TLS for this box's own hostnames (dashboard/landing/api/auth
  # [+grafana if observability is enabled]) and reverse-proxies to the
  # containers above by service name. click-router keeps its own ports
  # (4433/5800) published directly — it does its own per-customer-domain TLS.
  caddy:
    image: caddy:2-alpine
    container_name: shortas-caddy
    restart: unless-stopped
    # Bound to the PRIMARY IP explicitly, not left on the default
    # all-interfaces bind — that would collide with click-router's bind
    # on the second IP (same port, can't have both a wildcard and a
    # specific bind). See README.md "Two IPs on one server".
    ports:
      - "${PRIMARY_IP}:443:443"
      - "${PRIMARY_IP}:80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DASHBOARD_HOSTNAME=${DASHBOARD_HOSTNAME}
      - LANDING_HOSTNAME=${LANDING_HOSTNAME}
      - API_HOSTNAME=${API_HOSTNAME}
      - KEYCLOAK_HOSTNAME=${KEYCLOAK_HOSTNAME}
      - GRAFANA_HOSTNAME=${GRAFANA_HOSTNAME}
      - S3_PUBLIC_HOSTNAME=${S3_PUBLIC_HOSTNAME}
    depends_on:
      - dashboard
      - landing
      - management-api
      - keycloak
      - minio-nginx
    networks:
      - shortas-net

  # --- Optional: `docker compose --profile observability up -d` ---

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: shortas-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=14d'
    networks:
      - shortas-net

  loki:
    image: grafana/loki:3.0.0
    container_name: shortas-loki
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yml
    networks:
      - shortas-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: shortas-grafana
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://${GRAFANA_HOSTNAME}
    depends_on:
      - prometheus
      - loki
    networks:
      - shortas-net
