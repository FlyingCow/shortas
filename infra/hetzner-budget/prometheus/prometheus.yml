global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'click-router'
    static_configs:
      - targets: ['click-router:9092']
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: 'click-aggregator'
    static_configs:
      - targets: ['click-aggregator:9090']
    metrics_path: /metrics
    scrape_interval: 5s
