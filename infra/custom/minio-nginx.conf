server {
    listen 80;
    server_name localhost;

    # Increase buffer sizes for presigned URL query strings
    large_client_header_buffers 4 32k;

    location /route-images/ {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        # Preserve original Host header for AWS signature verification
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;

        # RustFS handles CORS (including OPTIONS preflight) itself via the
        # bucket CORS policy set in minio-setup. Do not add CORS headers
        # here too - that duplicates the header and browsers reject
        # responses with more than one Access-Control-Allow-Origin value.
    }
}
