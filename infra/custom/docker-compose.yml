version: "3.8"
include:
  - ../../redirect/docker-compose.yml
  - ../../management-api/docker-compose.yml
  - ../../ui/docker-compose.yml

networks:
  shortas-net:
    driver: bridge
    external: false

services:
  db:
    image: postgres:16.2
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - ${PWD}/fs/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shortas-net
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.6
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/keycloak-theme:/opt/keycloak/themes/shortas/login:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shortas-net
    restart: unless-stopped

  vault:
    image: hashicorp/vault:latest
    container_name: vault
    ports:
      - "8200:8200"
    volumes:
      - ${PWD}/fs/vault_data:/vault/file # For persistent file storage
      - ${PWD}/fs/config:/vault/config # For mounting custom configuration files
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "myroottoken" # For development mode, not recommended for production
      VAULT_ADDR: "http://0.0.0.0:8200"
    cap_add:
      - IPC_LOCK # Required for Vault's memory locking
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shortas-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: shortas-rabbitmq
    hostname: shortas-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - shortas-net

  minio:
    image: rustfs/rustfs:latest
    container_name: shortas-minio
    restart: unless-stopped
    ports:
      - "9002:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - minio_data:/data
    networks:
      - shortas-net

  minio-setup:
    image: amazon/aws-cli:latest
    container_name: shortas-minio-setup
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for RustFS to be ready...'
        until aws s3 ls >/dev/null 2>&1; do
          echo 'RustFS not ready, retrying in 2s...'
          sleep 2
        done
        create_bucket() {
          aws s3api head-bucket --bucket \"\$1\" >/dev/null 2>&1 || aws s3 mb \"s3://\$1\"
        }
        echo 'Creating clickhouse bucket...'
        create_bucket clickhouse
        echo 'Creating route-images bucket...'
        create_bucket route-images
        echo 'Creating loki bucket...'
        create_bucket loki
        echo 'Setting route-images bucket as public read...'
        printf '%s' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":\"s3:GetObject\",\"Resource\":\"arn:aws:s3:::route-images/*\"}]}' > /tmp/policy.json
        aws s3api put-bucket-policy --bucket route-images --policy file:///tmp/policy.json
        echo 'Configuring CORS for route-images bucket...'
        printf '%s' '{\"CORSRules\":[{\"AllowedHeaders\":[\"*\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"POST\",\"DELETE\"],\"AllowedOrigins\":[\"*\"],\"ExposeHeaders\":[\"ETag\",\"Content-Length\",\"Content-Type\"]}]}' > /tmp/cors.json
        aws s3api put-bucket-cors --bucket route-images --cors-configuration file:///tmp/cors.json
        echo 'RustFS setup complete'
      "
    networks:
      - shortas-net

  minio-nginx:
    image: nginx:alpine
    container_name: shortas-minio-nginx
    restart: unless-stopped
    ports:
      - "9003:80"
    volumes:
      - ./minio-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - minio
    networks:
      - shortas-net

volumes:
  minio_data:
    driver: local
  rabbitmq_data:
    driver: local
  safe_browsing_data:
    driver: local
