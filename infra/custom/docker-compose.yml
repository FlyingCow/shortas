version: "3.8"
include:
  - ../../redirect/docker-compose.yml
  - ../../management-api/docker-compose.yml
  - ../../ui/docker-compose.yml

networks:
  shortas-net:
    driver: bridge
    external: false

services:
  db:
    image: postgres:16.2
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - ${PWD}/fs/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shortas-net
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.6
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/keycloak-theme:/opt/keycloak/themes/shortas/login:ro
      - ./keycloak/keycloak-theme-account:/opt/keycloak/themes/shortas/account:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shortas-net
    restart: unless-stopped

  # Realm-export.json ships with NO smtpServer configured, so without this,
  # "forgot password" / "change password" emails are silently never sent.
  # Points at the Mailhog instance management-api/docker-compose.yml
  # already brings up — view sent mail at http://localhost:8025. Idempotent:
  # just PUTs the smtpServer block on every boot, safe to re-run.
  keycloak-smtp-setup:
    image: alpine:latest
    container_name: shortas-keycloak-smtp-setup
    depends_on:
      - keycloak
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: shortas-dev
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl
        for i in $$(seq 1 30); do
          curl -sf "$$KEYCLOAK_URL/realms/master" >/dev/null 2>&1 && break
          echo "Waiting for Keycloak..."; sleep 3
        done
        TOKEN=$$(curl -s -d "client_id=admin-cli" -d "username=$$KEYCLOAK_ADMIN_USER" -d "password=$$KEYCLOAK_ADMIN_PASSWORD" -d "grant_type=password" "$$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
        if [ -z "$$TOKEN" ]; then echo "Failed to get Keycloak admin token"; exit 1; fi
        curl -sf -X PUT "$$KEYCLOAK_URL/admin/realms/$$KEYCLOAK_REALM" \
          -H "Authorization: Bearer $$TOKEN" -H "Content-Type: application/json" \
          -d '{"smtpServer":{"host":"shortas-mailhog","port":"1025","from":"no-reply@shortas.space","fromDisplayName":"Shortas","auth":"false","starttls":"false","ssl":"false"}}'
        echo "Keycloak SMTP configured (Mailhog)"
    networks:
      - shortas-net

  vault:
    image: hashicorp/vault:latest
    container_name: vault
    ports:
      - "8200:8200"
    volumes:
      - ${PWD}/fs/vault_data:/vault/file # For persistent file storage
      - ${PWD}/fs/config:/vault/config # For mounting custom configuration files
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "myroottoken" # For development mode, not recommended for production
      VAULT_ADDR: "http://0.0.0.0:8200"
    cap_add:
      - IPC_LOCK # Required for Vault's memory locking
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shortas-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: shortas-rabbitmq
    hostname: shortas-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - shortas-net

  minio:
    image: rustfs/rustfs:latest
    container_name: shortas-minio
    restart: unless-stopped
    ports:
      - "9002:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - minio_data:/data
    networks:
      - shortas-net

  minio-setup:
    image: amazon/aws-cli:latest
    container_name: shortas-minio-setup
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for RustFS to be ready...'
        until aws s3 ls >/dev/null 2>&1; do
          echo 'RustFS not ready, retrying in 2s...'
          sleep 2
        done
        create_bucket() {
          aws s3api head-bucket --bucket \"\$1\" >/dev/null 2>&1 || aws s3 mb \"s3://\$1\"
        }
        echo 'Creating clickhouse bucket...'
        create_bucket clickhouse
        echo 'Creating route-images bucket...'
        create_bucket route-images
        echo 'Creating loki bucket...'
        create_bucket loki
        echo 'Setting route-images bucket as public read...'
        printf '%s' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":\"s3:GetObject\",\"Resource\":\"arn:aws:s3:::route-images/*\"}]}' > /tmp/policy.json
        aws s3api put-bucket-policy --bucket route-images --policy file:///tmp/policy.json
        echo 'Configuring CORS for route-images bucket...'
        printf '%s' '{\"CORSRules\":[{\"AllowedHeaders\":[\"*\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"POST\",\"DELETE\"],\"AllowedOrigins\":[\"*\"],\"ExposeHeaders\":[\"ETag\",\"Content-Length\",\"Content-Type\"]}]}' > /tmp/cors.json
        aws s3api put-bucket-cors --bucket route-images --cors-configuration file:///tmp/cors.json
        echo 'RustFS setup complete'
      "
    networks:
      - shortas-net

  notification-templates-sync:
    image: amazon/aws-cli:latest
    container_name: shortas-notification-templates-sync
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
    volumes:
      - ../../notification-templates:/templates:ro
    entrypoint: >
      /bin/sh -c "
        echo 'Syncing notification templates to s3://route-images/notification-templates/...'
        aws s3 sync /templates s3://route-images/notification-templates/ --delete
        echo 'Notification templates sync complete'
      "
    networks:
      - shortas-net

  minio-nginx:
    image: nginx:alpine
    container_name: shortas-minio-nginx
    restart: unless-stopped
    ports:
      - "9003:80"
    volumes:
      - ./minio-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - minio
    networks:
      - shortas-net

volumes:
  minio_data:
    driver: local
  rabbitmq_data:
    driver: local
  safe_browsing_data:
    driver: local
