version: "3.8"
include:
  - ../../redirect/docker-compose.yml
  - ../../api/docker-compose.yml
  - ../../ui/docker-compose.yml

networks:
  shortas-net:
    driver: bridge
    external: false

services:
  db:
    image: postgres:16.2
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - ${PWD}/fs/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shortas-net
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.6
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/keycloak-theme:/opt/keycloak/themes/shortas/login:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shortas-net
    restart: unless-stopped

  vault:
    image: hashicorp/vault:latest
    container_name: vault
    ports:
      - "8200:8200"
    volumes:
      - ${PWD}/fs/vault_data:/vault/file # For persistent file storage
      - ${PWD}/fs/config:/vault/config # For mounting custom configuration files
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "myroottoken" # For development mode, not recommended for production
      VAULT_ADDR: "http://0.0.0.0:8200"
    cap_add:
      - IPC_LOCK # Required for Vault's memory locking
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shortas-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: shortas-rabbitmq
    hostname: shortas-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - shortas-net

  minio:
    image: minio/minio:latest
    container_name: shortas-minio
    restart: unless-stopped
    ports:
      - "9002:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - shortas-net

  minio-setup:
    image: minio/mc:latest
    container_name: shortas-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for MinIO to be ready...'
        until mc alias set myminio http://minio:9000 minioadmin minioadmin; do
          echo 'MinIO not ready, retrying in 2s...'
          sleep 2
        done
        echo 'Creating clickhouse bucket...'
        mc mb myminio/clickhouse --ignore-existing
        echo 'Creating route-images bucket...'
        mc mb myminio/route-images --ignore-existing
        echo 'Creating loki bucket...'
        mc mb myminio/loki --ignore-existing
        echo 'Setting route-images bucket as public read...'
        mc anonymous set download myminio/route-images
        echo 'Configuring CORS for route-images bucket...'
        cat > /tmp/cors.json << 'EOF'
        {
          \"CORSRules\": [{
            \"AllowedHeaders\": [\"*\"],
            \"AllowedMethods\": [\"GET\", \"PUT\", \"POST\", \"DELETE\"],
            \"AllowedOrigins\": [\"*\"],
            \"ExposeHeaders\": [\"ETag\", \"Content-Length\", \"Content-Type\"]
          }]
        }
        EOF
        mc cors set myminio/route-images /tmp/cors.json
        echo 'MinIO setup complete'
      "
    networks:
      - shortas-net

  minio-nginx:
    image: nginx:alpine
    container_name: shortas-minio-nginx
    restart: unless-stopped
    ports:
      - "9003:80"
    volumes:
      - ./minio-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - minio
    networks:
      - shortas-net

volumes:
  minio_data:
    driver: local
  rabbitmq_data:
    driver: local
  safe_browsing_data:
    driver: local
