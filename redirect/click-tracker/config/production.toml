[pipeline]
channel_capacity = 5000       # Bounded channel buffer size (increased from CPUs/2)
# parallelism = 4             # Optional: Override auto-detection (CPUs/2)

[aws]
local = false

[aws.dynamo]
user_settings_table = "core-user-settings-main"

[mongodb]
uri = "mongodb://root:example@mongo:27017/"
database = "shortas"
user_settings_collection = "core_user_settings_main"

[kafka]
[kafka.hit_stream]
topic = "hit-stream-main"
hosts = ["localhost"]

[kafka.click_aggs]
topic = "click-aggs-main"
hosts = ["localhost:9092", "localhost:9093"]
ack_timeout_secs = 60


[fluvio]
[fluvio.hit_stream]
topic = "hit-stream-main"
host = "localhost:9003"
consumer = "hit-tracker"

[fluvio.click_aggs]
topic = "click-aggs-local"
host = "localhost:9003"
batch_size = 500           # Optimized: Increased from 100 for better throughput
linger_millis = 100        # Optimized: Reduced from 500ms for lower latency


[uaparser]
yaml = "./data/ua-parser/regexes.yaml"

[geo_ip]
mmdb = "./data/geo-ip/GeoLite2-Country.mmdb"

