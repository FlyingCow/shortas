debug = true

[aws]
local = true
localstack_endpoint = "http://localhost:4566"

[aws.dynamo]
user_settings_table = "core-user-settings-local"

[mongodb]
uri = "mongodb://root:example@mongo:27017/"
database = "shortas"
user_settings_collection = "core_user_settings_local"

[kafka]
[kafka.hit_stream]
topic = "hit-stream-local"
hosts = ["localhost"]

[kafka.click_aggs]
topic = "click-aggs-local"
hosts = ["localhost:9092", "localhost:9093"]
ack_timeout_secs = 60


[fluvio]
[fluvio.hit_stream]
topic = "hit-stream-main"
host = "localhost:9003"
consumer = "hit-tracker"

[fluvio.click_aggs]
topic = "click-aggs-local"
host = "localhost:9003"
batch_size = 100
linger_millis = 500

[uaparser]
yaml = "../data/ua-parser/regexes.yaml"

[geo_ip]
