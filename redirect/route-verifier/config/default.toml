[server]
port = 5831

[mongodb]
connection_string = "mongodb://root:example@mongo:27017/"
database_name = "shortas"
collection = "routes_to_verify"

# Used only in aws/aws-dev run modes (see AppBuilder::with_aws). The real
# table name is always injected by Terraform via APP__AWS__DYNAMO__ROUTES_TABLE.
[aws]
local = false

[aws.dynamo]
routes_table = "core-routes-to-verify-dev"

[rabbitmq]
uri = "amqp://guest:guest@rabbitmq:5672/%2f"
route_status_exchange = "route.status.changed"
reconnect_seconds = 5

[safe_browsing]
base_url = "http://safe-browsing:5000"
timeout_seconds = 120

[worker]
check_interval_seconds = 300
batch_size = 100
recheck_interval_hours = 24
blocked_recheck_interval_hours = 1
