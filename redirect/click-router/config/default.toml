[aws]

[aws.dynamo]
encryption_table = "core-routes-encryption-main"
routes_table = "core-routes-main"
hostname_mappings_table = "core-routes-hostname-mapping-main"
user_settings_table = "core-user-settings-main"
conversions_table = "core-conversions-main"

[mongodb]
uri = "mongodb://root:example@mongo:27017/"
database = "shortas"
encryption_collection = "core_routes_encryption_main"
routes_collection = "core_routes_main"
hostname_mappings_collection = "core_routes_hostname_mapping_main"
user_settings_collection = "core_user_settings_main"
conversions_collection = "core_conversions_main"
challenges_collection = "acme_challenges"


[kafka]
[kafka.hit_stream]
topic = "hit-stream-main"
hosts = ["localhost:9092", "localhost:9093"]
ack_timeout_secs = 60
batch_size = 100
consumers_count = 2
iteration_seconds = 1

[fluvio]
[fluvio.hit_stream]
topic = "hit-stream-main"
host = "sc:9003"
batch_size = 10000
linger = 1000

[moka]
[moka.crypto_cache]
max_capacity = 10_000
time_to_live_minutes = 60
time_to_idle_minutes = 20

[moka.routes_cache]
max_capacity = 10_000
time_to_live_minutes = 60
time_to_idle_minutes = 20

[moka.user_settings_cache]
max_capacity = 10_000
time_to_live_minutes = 60
time_to_idle_minutes = 20

[moka.challenge_cache]
max_capacity = 10_000
time_to_live_minutes = 5
time_to_idle_minutes = 2

[uaparser]
yaml = "../data/ua-parser/user-agents.yaml"

[geo_ip]
mmdb = "../data/geo-ip/GeoLite2-Country.mmdb"

[redirect]
not_found_url = "http://pages:5801/not-found?domain={}"
index_url = "http://pages:5801/index?domain={}"
blocked_url = "http://pages:5801/blocked?reason={}"
qr_images_base_url = "http://minio-nginx/route-images"
# Add shortas_cid to the destinations of routes covered by conversions
click_ids_enabled = false

[conversions]
enabled = false
# Networks whose X-Forwarded-For is believed, for limits per client address
trusted_proxies = []
max_concurrent_requests = 256
# Per client address. Servers with a valid secret key are exempt.
address_rate = { per_second = 20.0, burst = 100.0 }
# Per conversion, separately for browsers and servers
key_rate = { per_second = 200.0, burst = 1000.0 }

[conversions.stream]
host = "sc:9003"
topic = "conversion-stream-main"
batch_size = 100000
linger = 5

[rabbitmq]
uri = "amqp://guest:guest@rabbitmq:5672/%2f"
route_exchange = "cache.invalidation.routes"
user_settings_exchange = "cache.invalidation.user_settings"
reconnect_seconds = 5

[server]
threads = 8
listen_os_signals = true
exit = true

[tls]
sni_enabled = true
# fallback_cert_path = "/etc/shortas/tls/cert.pem"
# fallback_key_path = "/etc/shortas/tls/key.pem"
