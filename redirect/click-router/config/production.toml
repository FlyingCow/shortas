[aws]
local = false

[aws.dynamo]
encryption_table = "core-routes-encryption-main"
routes_table = "core-routes-main"
hostname_mappings_table = "core-routes-hostname-mapping-main"
user_settings_table = "core-user-settings-main"

[mongodb]
uri = "mongodb://root:example@mongo:27017/"
database = "shortas"
encryption_collection = "core_routes_encryption_main"
routes_collection = "core_routes_main"
hostname_mappings_collection = "core_routes_hostname_mapping_main"
user_settings_collection = "core_user_settings_main"

[kafka]
[kafka.hit_stream]
topic = "hit-stream-main"
hosts = ["localhost"]
ack_timeout_secs = 60
batch_size = 100
consumers_count = 2
iteration_seconds = 1

[fluvio]
[fluvio.hit_stream]
topic = "hit-stream-main"
host = "sc:9003"
batch_size = 500      # Optimized: balance between throughput and latency
linger = 100          # 100ms batching window

[uaparser]
yaml = "./data/ua-parser/regexes.yaml"

[geo_ip]
mmdb = "./data/geo-ip/GeoLite2-Country.mmdb"

[moka]
[moka.crypto_cache]
max_capacity = 1_000
time_to_live_minutes = 1440  # 24 hours
time_to_idle_minutes = 720   # 12 hours

[moka.routes_cache]
max_capacity = 100_000       # Increased from 10,000 for high traffic
time_to_live_minutes = 120   # 2 hours
time_to_idle_minutes = 60    # 1 hour

[moka.user_settings_cache]
max_capacity = 50_000        # Increased from 10,000
time_to_live_minutes = 240   # 4 hours
time_to_idle_minutes = 120   # 2 hours

[redirect]
not_found_url = "http://pages:5801/not-found?domain={}"
index_url = "http://pages:5801/index?domain={}"
blocked_url = "http://pages:5801/blocked?reason={}"
