[workspace]
resolver = "2"
members = [
    "click-router",
    "click-aggregator",
    "click-aggregator-api",
    "click-router-api",
    "click-tracker",
    "infra/domains",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Max Cechina <max@cechina.tech>"]
license = "MIT"
repository = "https://github.com/FlyingCow/shortas"
homepage = "https://shortas.com"
documentation = "https://shortas.work/"

[workspace.dependencies]
# Core async runtime and utilities
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = "0.7.14"
tokio-graceful-shutdown = "0.16.0"
async-trait = "0.1.88"
async-recursion = "1.1.1"
futures = "0.3.31"

# Error handling
anyhow = "1.0.97"
thiserror = "2.0.17"

# Serialization
serde = { version = "1.0.200", features = ["derive"] }
serde_derive = "1.0.200"
serde_json = "1.0.117"
serde_dynamo = { version = "4.2.14", features = ["aws-sdk-dynamodb+1"] }

# Time and date
chrono = { version = "0.4.38", features = ["serde"] }

# Configuration and CLI
config = "0.15.17"
clap = { version = "4.5.4", features = ["derive", "env"] }
dotenv = "0.15.0"

# AWS SDK
aws-config = "1.3.0"
aws-sdk-dynamodb = "1.25.0"
aws-sdk-kinesis = "1.25.0"

# HTTP and web framework
salvo = { version = "0.84.0", features = ["oapi"] }
http = "1.1.0"
hyper = "1.3.1"
hyper-util = { version = "0.1.5", features = ["full"] }
hyper-rustls = { version = "0.27.5", features = ["native-tokio", "rustls-native-certs", "ring", "http1", "http2", "tls12", "logging"] }
rustls = "0.23.9"
reqwest = { version = "0.12.0", features = ["json"] }

# Caching and storage
moka = { version = "0.12.7", features = ["future"] }
redis = { version = "0.32.5", features = ["cluster", "aio", "tokio-comp", "connection-manager"] }
mongodb = "3.3.0"
clickhouse = { version = "0.13.2", features = ["inserter", "chrono"] }

# Streaming and messaging
fluvio = "0.50.1"
kafka = "0.10.0"
rdkafka = "0.37.0"
flume = "0.11.1"
lapin = "2.5"

# Utilities and parsing
uaparser = "0.6.4"
maxminddb = "0.26.0"
urlencoding = "2.1.3"
ulid = "1.1.3"
uuid = "1.8.0"
rand = "0.9.1"
fastrand = "2.3.0"
percent-encoding = "2.3.1"
base64 = "0.22.0"
url = "2.5.0"
accept-language = "3.1.0"
string_format = "0.1.0"
cookie = "0.18.1"
multimap = "0.10.0"
indexmap = "2.2.6"

# Logging and tracing
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
env_logger = "0.11.3"

# Monitoring and metrics
prometheus = { version = "0.13.4", features = ["process"] }
lazy_static = "1.4.0"

# Security and crypto
jsonwebtoken = "9.3.0"
sha2 = "0.10.8"

# Validation and utilities
validator = "0.20.0"
derive_more = { version = "2.0.1", features = ["full"] }
dyn-clone = "1.0.17"
typed-builder = "0.21.0"
signal-hook = "0.3.17"

# QR code generation
qrcode = "0.14.1"
image = "0.25.5"

# Tower ecosystem
tower = { version = "0.5.2", features = ["full"] }

# HTTP body utilities
http-body-util = "0.1.1"

# Development dependencies
criterion = { version = "0.6.0", features = ["html_reports", "async_futures"] }
