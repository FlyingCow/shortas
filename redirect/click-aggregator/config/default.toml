[kafka]
[kafka.click_stream]
topic = "click-aggs-local"
hosts = ["localhost:9092", "localhost:9093"]

[fluvio]
[fluvio.click_stream]
topic = "click-aggs-local"
host = "fluvio:9103"
consumer = "click_aggs"

[conversions]
enabled = true
reconcile_millis = 5000
late_recheck_millis = 60000

[conversions.stream]
topic = "conversion-stream-main"
host = "sc:9003"
consumer = "conversions"

[clickhouse]
[clickhouse.click_stream_store]
url = "http://localhost:8123"
user = "default"
password = "clickhouse"
max_rows = 100_000
period_millis = 100
period_bias = 0.1
database = "shortas"
table = "click_stream"

[server]
threads = 8
listen_os_signals = true
exit = true
