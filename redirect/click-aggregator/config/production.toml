[kafka]
[kafka.click_stream]
topic = "click-aggs-main"
hosts = ["kafka:9092", "kafka:9093"]

[fluvio]
[fluvio.click_stream]
topic = "click-aggs-main"
host = "sc:9003"
consumer = "aggs"

[clickhouse]
[clickhouse.click_stream_store]
url = "http://clickhouse:8123"
user = "default"
password = "clickhouse"
max_rows = 100_000
period_millis = 100
period_bias = 0.1
database = "shortas"
table = "click_stream"

[server]
threads = 8
listen_os_signals = true
exit = true
