[rabbitmq]
# URI is loaded from environment variable APP_RABBITMQ_URI in AWS
uri = "amqp://guest:guest@shortas-rabbitmq:5672/%2f"
route_exchange = "cache.invalidation.routes"
reconnect_seconds = 5

# No [s3] override here: this file is used for the local Docker Compose
# stack (APP_RUN_MODE=production is how all redirect/ services run there,
# same as the rabbitmq URI above pointing at the local "shortas-rabbitmq"
# host), so it should keep default.toml's local MinIO endpoint/bucket/
# credentials/path-style. Real AWS S3 settings (no endpoint, IAM role,
# virtual-hosted-style addressing) belong in aws.toml / aws-dev.toml,
# which are already correct - don't duplicate them here.

[worker]
request_timeout_seconds = 15
max_image_size_bytes = 2097152  # 2MB for production
