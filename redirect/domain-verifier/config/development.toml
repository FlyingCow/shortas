[server]
port = 5830

[mongodb]
connection_string = "mongodb://root:example@localhost:27017/"
database_name = "shortas"
collection = "domains"

[rabbitmq]
uri = "amqp://guest:guest@localhost:5672/%2f"
domain_state_exchange = "domain.state.changed"
reconnect_seconds = 5

[dns]
txt_record_name = "_shortas-domain-challenge"
allowed_ipv4 = ["127.0.0.1", "203.0.113.10"]
allowed_ipv6 = []

[worker]
check_interval_seconds = 30
batch_size = 50
recheck_interval_minutes = 15
failed_recheck_interval_minutes = 2
