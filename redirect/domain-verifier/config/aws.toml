# AWS Production Configuration for Domain Verifier
# This config is used when running on AWS ECS

[server]
port = 5830

[aws]
local = false

[aws.dynamo]
domains_table = "core-domains-prod"

# MongoDB is not used in AWS - DynamoDB is the primary store
[mongodb]
connection_string = ""
database_name = ""
collection = ""

# RabbitMQ URI is loaded from environment variable APP_RABBITMQ_URI
[rabbitmq]
domain_state_exchange = "domain.state.changed"
reconnect_seconds = 5

[dns]
txt_record_name = "_shortas-domain-challenge"
allowed_ipv4 = ["203.0.113.10"]  # Replace with actual click-router IPs
allowed_ipv6 = []

[worker]
check_interval_seconds = 60
batch_size = 100
recheck_interval_minutes = 30
failed_recheck_interval_minutes = 5
