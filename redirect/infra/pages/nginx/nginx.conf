server {
    listen 5801;
    server_name _;

    root /usr/share/nginx/html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disable server version disclosure
    server_tokens off;

    # Index page - receives domain as query param
    # URL: /index?domain=example.com
    location = /index {
        default_type text/html;
        try_files /index.html =404;
    }

    # Not found page - receives domain and path as query params
    # URL: /not-found?domain=example.com&path=abc123
    location = /not-found {
        default_type text/html;
        try_files /not-found.html =404;
    }

    # Blocked page - receives reason as query param
    # URL: /blocked?reason=Malware
    location = /blocked {
        default_type text/html;
        try_files /blocked.html =404;
    }

    # Catch-all for direct HTML file access
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets
    location ~* \.(html|css|js)$ {
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }
}
