<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
    <title>Link Blocked</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e8e8e8;
        }

        .container {
            text-align: center;
            padding: 3rem;
            max-width: 600px;
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem;
            background: linear-gradient(135deg, #c0392b 0%, #8e44ad 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(192, 57, 43, 0.3);
        }

        .icon svg {
            width: 40px;
            height: 40px;
            fill: white;
        }

        .code {
            font-size: 5rem;
            font-weight: 700;
            color: #c0392b;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #fff;
        }

        .reason {
            font-size: 1rem;
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.1);
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            margin: 1.5rem 0;
            border: 1px solid rgba(231, 76, 60, 0.2);
        }

        .reason-label {
            font-size: 0.75rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .reason-text {
            word-break: break-word;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #a0a0a0;
        }

        .warning {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(241, 196, 15, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(241, 196, 15, 0.2);
        }

        .warning svg {
            width: 20px;
            height: 20px;
            fill: #f1c40f;
            flex-shrink: 0;
        }

        .warning-text {
            font-size: 0.875rem;
            color: #f1c40f;
        }

        .footer {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.875rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8 0-1.85.63-3.55 1.69-4.9L16.9 18.31C15.55 19.37 13.85 20 12 20zm6.31-3.1L7.1 5.69C8.45 4.63 10.15 4 12 4c4.42 0 8 3.58 8 8 0 1.85-.63 3.55-1.69 4.9z"/>
            </svg>
        </div>
        <div class="code">410</div>
        <h1>Link Blocked</h1>
        <p>This link has been blocked and is no longer accessible.</p>
        <div class="reason" id="reason-container" style="display: none;">
            <div class="reason-label">Reason</div>
            <div class="reason-text" id="reason-display"></div>
        </div>
        <div class="warning">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
            </svg>
            <span class="warning-text">This link may have been reported for violating our terms of service.</span>
        </div>
        <div class="footer">
            Powered by Shortas
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // Safely extract and sanitize parameters
            function sanitize(str) {
                if (!str) return '';
                // Remove any HTML tags and special characters, limit length
                return str.replace(/[<>"'&]/g, '').substring(0, 500);
            }

            function getParam(name) {
                var params = new URLSearchParams(window.location.search);
                return sanitize(params.get(name) || '');
            }

            // Display reason safely using textContent (XSS-safe)
            var reason = getParam('reason');
            var containerEl = document.getElementById('reason-container');
            var displayEl = document.getElementById('reason-display');

            if (reason) {
                displayEl.textContent = reason;
                containerEl.style.display = 'block';
            }

            // Remove query parameters from URL
            if (window.location.search) {
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        })();
    </script>
</body>
</html>
