title: Shortas
description: >-
  Self-hostable URL shortener with custom domains, conditional routing,
  and real-time click analytics.
url: "https://shortas.work"
baseurl: ""
github_username: FlyingCow

markdown: kramdown
theme: minima
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "professional-theme"

navigation:
  - title: Home
    url: /
  - title: Getting Started
    url: /getting-started/
  - title: Architecture
    url: /architecture/
  - title: Deployment
    url: /deployment/
  - title: Development
    url: /development/
  - title: API
    url: /api/
  - title: About
    url: /about/

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - README.md
