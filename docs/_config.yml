# Shortas Documentation Configuration
# GitHub Pages compatible Jekyll configuration

# Site settings
title: Shortas Documentation
email: docs@shortas.com
description: >- 
  Comprehensive documentation for Shortas - a fast and scalable URL shortener 
  with advanced analytics, multi-tenancy, and real-time click tracking capabilities.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://flyingcow.github.io" # the base hostname & protocol for your site
twitter_username: shortas
github_username: FlyingCow

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# GitHub Pages specific settings
github: [metadata]

# Vector.dev inspired theme settings
theme_settings:
  primary_color: "#00d4aa"
  background_color: "#0a0e1a"
  text_color: "#ffffff"
  accent_color: "#ff6b6b"

# Collections
collections:
  guides:
    output: true
    permalink: /:collection/:name/
  api:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "vector-theme"
  - scope:
      path: ""
      type: "guides"
    values:
      layout: "vector-theme"
  - scope:
      path: ""
      type: "api"
    values:
      layout: "vector-theme"

# Navigation
navigation:
  - title: Home
    url: /
  - title: Getting Started
    url: /getting-started/
  - title: Architecture
    url: /architecture/
  - title: API Reference
    url: /api/
  - title: Deployment
    url: /deployment/
  - title: Development
    url: /development/
  - title: About
    url: /about/

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - vendor/
  - README.md
  - LICENSE
  - .gitignore
