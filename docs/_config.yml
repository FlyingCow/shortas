# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Shortas Documentation
email: docs@shortas.com
description: >- 
  Comprehensive documentation for Shortas - a fast and scalable URL shortener 
  with advanced analytics, multi-tenancy, and real-time click tracking capabilities.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://docs.shortas.com" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: shortas
github_username: FlyingCow

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Collections
collections:
  guides:
    output: true
    permalink: /:collection/:name/
  api:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "guides"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "api"
    values:
      layout: "page"

# Navigation
navigation:
  - title: Home
    url: /
  - title: Getting Started
    url: /getting-started/
  - title: Architecture
    url: /architecture/
  - title: API Reference
    url: /api/
  - title: Deployment
    url: /deployment/
  - title: Development
    url: /development/
  - title: About
    url: /about/

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - vendor/
